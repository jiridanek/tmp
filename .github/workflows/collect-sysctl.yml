name: Collect system tuning flags

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/collect-sysctl.sh

      - name: Collect system tuning flags
        run: |
          mkdir -p out
          ./scripts/collect-sysctl.sh 2>&1 | tee out/sysctl-report.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysctl-report
          path: out/sysctl-report.txt
          if-no-files-found: warn
          retention-days: 7
